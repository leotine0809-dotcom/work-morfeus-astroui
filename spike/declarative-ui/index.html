<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>astrochat</title>
    <!-- no-flash: own the theme class + accent knob on <html> before first paint (DESIGN-DNA §7).
         React must not manage <html>'s class; this script does, and hydration can't clobber it. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("astrochat.mode") || "dark";
          if (m === "dark") document.documentElement.classList.add("dark");
          var a = (localStorage.getItem("astrochat.acc") || "226,0.11").split(",");
          document.documentElement.style.setProperty("--acc-h", a[0]);
          document.documentElement.style.setProperty("--acc-c", a[1]);
        } catch (e) { document.documentElement.classList.add("dark"); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
