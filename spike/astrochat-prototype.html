<title>astrochat</title>
<meta name="description" content="Interactive comms console prototype — one metal sidebar, flat workspace, astrobot date/time, live accent." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: dark;
    --acc-h: 226; --acc-c: 0.11;                 /* astrobot's one accent knob — the picker swaps these */
    --background: oklch(0.155 0.005 var(--acc-h));
    --foreground: oklch(0.96 0.004 var(--acc-h));
    --card: oklch(0.19 0.006 var(--acc-h));
    --muted: oklch(0.66 0.012 var(--acc-h));
    --faint: oklch(0.52 0.008 var(--acc-h));
    --accent: oklch(0.255 0.009 var(--acc-h));   /* selected/hover GREY fill — never a tint */
    --border: oklch(1 0 0 / 8%);
    --border-soft: oklch(1 0 0 / 5%);
    --primary: oklch(0.80 var(--acc-c) var(--acc-h));
    --primary-ink: oklch(0.18 0.03 var(--acc-h));
    --bubble-in: oklch(0.225 0.006 var(--acc-h));
    --bubble-out: oklch(0.52 var(--acc-c) var(--acc-h));   /* FIXED lightness → white ink safe on any accent */
    --bubble-out-ink: oklch(0.99 0 0);
    --acc-dim: color-mix(in oklch, var(--primary) 15%, transparent);
    --acc-line: color-mix(in oklch, var(--primary) 34%, transparent);
    --wa:#48ca8c; --tg:#3aa6de; --slack:#b57bd8; --mail:#e0a33a; --teams:#7b83e8;
    --green:#48ca8c; --amber:#e0a33a;
    --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:oklch(1 0 0 / .14);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  ::selection{background:color-mix(in oklch, var(--primary) 30%, transparent)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

  .app{height:100svh;display:grid;grid-template-columns:360px minmax(0,1fr) 320px;overflow:hidden}

  /* ── one metal sidebar (astrobot .brushed-metal, no grain) ── */
  .sidebar{position:relative;display:flex;flex-direction:column;min-height:0;
    background:linear-gradient(180deg,oklch(0.208 0.007 var(--acc-h)) 0%,oklch(0.190 0.006 var(--acc-h)) 50%,oklch(0.174 0.005 var(--acc-h)) 100%);
    box-shadow:inset 0 1px 0 oklch(1 0 0 / .028), inset -1px 0 0 oklch(0 0 0 / .30)}
  .topbar{padding:0 14px;border-bottom:1px solid var(--border-soft)}
  .brandrow{height:60px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border-soft)}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--primary),color-mix(in oklch,var(--primary) 55%,black));box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
  .mark svg{width:17px;height:17px;color:var(--primary-ink)}
  .word{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .channels{display:flex;gap:4px;padding:10px 0}
  .ch{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:.14s;flex:none}
  .ch svg{width:20px;height:20px}
  .ch:hover{background:rgba(255,255,255,.06);color:var(--foreground)}
  .ch.active{background:var(--acc-dim);color:var(--primary);box-shadow:inset 0 0 0 1px var(--acc-line)}
  .ch .badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--primary);color:var(--primary-ink);font:600 9px/15px var(--mono);text-align:center;box-shadow:0 0 0 2px oklch(0.19 0.006 var(--acc-h))}

  .listhead{padding:12px 16px 8px;display:flex;flex-direction:column;gap:11px}
  .listhead h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
  .listhead .scope{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px;border:1px solid var(--border);border-radius:6px}
  .search{display:flex;align-items:center;gap:8px;height:34px;background:rgba(0,0,0,.22);border:1px solid var(--border-soft);border-radius:10px;padding:0 11px;color:var(--muted)}
  .search svg{width:16px;height:16px;flex:none}
  .search input{border:0;background:none;color:var(--foreground);width:100%;font:14px var(--sans)}
  .search input::placeholder{color:var(--faint)}
  .rows{flex:1;overflow-y:auto;padding:4px 10px 10px}
  .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px;border-radius:12px;width:100%;text-align:left;cursor:pointer;transition:background .12s}
  .row:hover{background:rgba(255,255,255,.045)}
  .row.active{background:var(--accent)}            /* plain grey — no tint, no border */
  .av{position:relative;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#eef3f6;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .av .cb{position:absolute;bottom:-2px;right:-2px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2.5px oklch(0.19 0.006 var(--acc-h))}
  .row.active .av .cb{box-shadow:0 0 0 2.5px var(--accent)}
  .av .cb svg{color:#08130a}
  .mid{min-width:0}
  .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .tm{font:500 11px var(--mono);color:var(--faint);flex:none}
  .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
  .pv{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font:600 11px/19px var(--mono);text-align:center;flex:none}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--border-soft)}
  .me{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500}
  .me .disc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#cfd8de;background:linear-gradient(145deg,oklch(0.34 0.01 var(--acc-h)),oklch(0.22 0.008 var(--acc-h)))}
  .accents{display:flex;gap:6px}
  .swatch{width:17px;height:17px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .12s}
  .swatch:hover{transform:scale(1.14)}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--background),0 0 0 3.5px currentColor}

  /* ── flat workspace ── */
  .thread{position:relative;background:var(--background);display:flex;flex-direction:column;min-width:0;min-height:0}
  .thead{height:60px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--border-soft)}
  .thead .who{min-width:0;flex:1}
  .thead .nm{font-weight:600;font-size:15px}
  .thead .sub{display:flex;align-items:center;gap:7px;color:var(--muted);font:500 12px var(--mono);margin-top:1px}
  .pres{width:7px;height:7px;border-radius:50%;flex:none}
  .pres.online{background:var(--green);box-shadow:0 0 8px color-mix(in oklch,var(--green) 60%,transparent)}
  .pres.away{background:var(--amber)} .pres.offline{background:var(--faint)}
  .back{display:none;width:34px;height:34px;border-radius:9px;place-items:center;color:var(--muted)}
  .back svg{width:20px;height:20px}
  .msgs{flex:1;overflow-y:auto;padding:16px 22px 12px;display:flex;flex-direction:column;gap:9px}
  .datepill{align-self:center;position:sticky;top:2px;z-index:5;margin:4px 0;border:1px solid var(--border);background:color-mix(in oklch,var(--card) 85%,transparent);backdrop-filter:blur(6px);border-radius:999px;padding:2px 10px;font:500 11px var(--sans);color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .timemark{align-self:center;margin:2px 0;font:500 10px var(--mono);color:color-mix(in oklch,var(--muted) 70%,transparent)}
  .msg{max-width:76%;display:flex;flex-direction:column;gap:3px}
  .msg.in{align-self:flex-start} .msg.out{align-self:flex-end;align-items:flex-end}
  .sender{font:600 11.5px var(--mono);margin-left:4px}
  .bubble{padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.5}
  .msg.in .bubble{background:var(--bubble-in);border-bottom-left-radius:6px}
  .msg.out .bubble{background:var(--bubble-out);color:var(--bubble-out-ink);border-bottom-right-radius:6px}
  .composer{padding:12px 18px 16px;border-top:1px solid var(--border-soft)}
  .cbox{display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:9px 9px 9px 16px;transition:.15s}
  .cbox:focus-within{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-dim)}
  .cbox textarea{flex:1;border:0;background:none;color:var(--foreground);resize:none;font:14px var(--sans);line-height:1.5;max-height:120px;padding:5px 0}
  .cbox textarea::placeholder{color:var(--faint)}
  .send{width:36px;height:36px;border-radius:50%;background:var(--foreground);display:grid;place-items:center;flex:none;transition:.15s}
  .send:disabled{background:oklch(1 0 0 / .3);cursor:default}
  .send svg{width:18px;height:18px;color:var(--background)}

  /* ── scheda (flat) ── */
  .scheda{background:var(--background);border-left:1px solid var(--border-soft);overflow-y:auto;min-height:0}
  .schero{padding:26px 20px 18px;text-align:center;border-bottom:1px solid var(--border-soft)}
  .schero .av{margin:0 auto 12px}
  .schero .nm{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .schero .role{color:var(--muted);font-size:13px;margin-top:3px}
  .schero .role b{color:var(--foreground);font-weight:500}
  .scpres{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .scsec{padding:16px 20px;border-bottom:1px solid var(--border-soft)}
  .scsec h3{margin:0 0 11px;font:600 11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
  .scsec h3 em{color:var(--primary);font-style:normal}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border:1px solid var(--border);border-radius:20px;font-size:12.5px;background:oklch(1 0 0 / .03)}
  .chip .dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
  .chip .dot svg{width:9px;height:9px;color:#08130a}
  .facts{display:flex;flex-direction:column;gap:9px}
  .fact{display:flex;justify-content:space-between;gap:12px;font-size:13px}
  .fact .k{color:var(--muted)} .fact .v{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
  .topics{display:flex;flex-wrap:wrap;gap:6px}
  .topic{padding:4px 9px;border-radius:7px;background:var(--acc-dim);color:var(--primary);font:500 12px var(--sans)}
  .files{display:flex;flex-direction:column;gap:8px}
  .file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:oklch(1 0 0 / .03);border:1px solid var(--border-soft)}
  .file .fi{width:30px;height:30px;border-radius:8px;background:oklch(1 0 0 / .05);display:grid;place-items:center;color:var(--muted);flex:none}
  .file .fi svg{width:15px;height:15px}
  .file .fn{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file .fm{font:11px var(--mono);color:var(--faint)}
  .members{display:flex;align-items:center}
  .members .av{margin-left:-8px;box-shadow:0 0 0 2px var(--background)}
  .members .av:first-child{margin-left:0}
  .members .more{margin-left:8px;font:500 12px var(--mono);color:var(--muted)}
  .brain{margin:16px 20px 22px;padding:13px 14px;border-radius:12px;background:linear-gradient(160deg,var(--acc-dim),transparent);border:1px solid var(--acc-line)}
  .brain .bh{display:flex;align-items:center;gap:7px;font:600 11px var(--mono);color:var(--primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
  .brain .bh svg{width:14px;height:14px}
  .brain p{margin:0;font-size:13px;color:color-mix(in oklch,var(--foreground) 82%,var(--background));line-height:1.5}

  @media(max-width:1180px){.app{grid-template-columns:340px minmax(0,1fr)}.scheda{display:none}}
  @media(max-width:800px){
    .app{grid-template-columns:minmax(0,1fr)}
    .app:not(.viewing) .thread{display:none}
    .app.viewing .sidebar{display:none}
    .app.viewing .back{display:grid}
  }
</style>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="topbar">
      <div class="brandrow">
        <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H9l-4 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/></svg></span>

</div>

   sc:{role:'Slack channel',company:'6 members',chans:['slack'],facts:[['Members','6'],['Timezone','Mixed'],['Known since','Feb 2025']],topics:['Launch','Pricing'],files:[['final-pricing.png','640 KB']],members:[['DK',150],['TM',35],['MO',16],['AB',260],['JS',200],['RP',320]],brain:'3 people, 1 open decision: the per-seat price. Dana is waiting on slide 7.'}},
  {id:'priya',name:'Priya Nair',ch:'mail',hue:330,pres:'offline',unread:0,time:'Tue',
   msgs:[{d:'in',x:'Following up on the data room — can you share the Q2 metrics?',t:'17:30',day:'Yesterday'},{d:'out',x:'Sending the updated deck + metrics by EOD. Thanks for the patience.',t:'18:02'},{d:'in',x:'Great, appreciate it. Let’s find time next week.',t:'08:10',day:'Today'}],
   sc:{role:'Partner',company:'Vertex Capital',chans:['mail'],facts:[['Company','Vertex Capital'],['Role','Partner'],['Timezone','EST (UTC−5)'],['Known since','Feb 2025']],topics:['Fundraise','Metrics'],files:[['Q2-metrics.pdf','1.1 MB']],brain:'Investor, warm. Waiting on two things from you: the Q2 metrics and a meeting slot next week.'}},
];

const $=s=>document.querySelector(s);
const initials=n=>n.replace(/^#/,'').split(/[\s-]+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(hue,txt,px,ch)=>`<span class="av" style="width:${px}px;height:${px}px;font-size:${px*.36}px;background:linear-gradient(145deg,hsl(${hue} 42% 44%),hsl(${hue} 46% 27%))">${txt}${ch?`<span class="cb" style="width:${px*.4}px;height:${px*.4}px;background:${CH[ch].c}"><span style="width:58%;height:58%;display:grid">${ICONS[CH[ch].i]}</span></span>`:''}</span>`;
const parseMin=t=>{const[h,m]=t.split(':').map(Number);return(h||0)*60+(m||0)};
const fmt12=t=>{const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const h12=h%12===0?12:h%12;return`${h12}:${String(m).padStart(2,'0')} ${ap}`};

let filter='all',activeId='mara',accent=ACCENTS[0];
function setVar(){document.documentElement.style.setProperty('--acc-h',accent.h);document.documentElement.style.setProperty('--acc-c',accent.c)}

function renderChannels(){$('#channels').innerHTML=RAIL.map(r=>`<button class="ch${r.k===filter?' active':''}" data-k="${r.k}" title="${r.k==='all'?'All inboxes':CH[r.k].label}">${ICONS[r.k==='all'?'all':CH[r.k].i]}${r.b?`<span class="badge">${r.b}</span>`:''}</button>`).join('')}
function renderAccents(){$('#accents').innerHTML=ACCENTS.map(a=>`<button class="swatch" data-a="${a.id}" title="${a.n}" aria-pressed="${a.id===accent.id}" style="background:oklch(0.72 ${a.c} ${a.h});color:oklch(0.72 ${a.c} ${a.h})"></button>`).join('')}
function visible(){const q=($('#search').value||'').toLowerCase();return DATA.filter(c=>(filter==='all'||c.ch===filter)&&(!q||c.name.toLowerCase().includes(q)||c.msgs.some(m=>m.x.toLowerCase().includes(q))))}
function renderList(){
  $('#scopeT').childNodes[0].nodeValue=(filter==='all'?'All inboxes':CH[filter].label)+' ';
  $('#scopeTag').textContent=filter==='all'?'6 channels':filter;
  const L=visible();
  $('#rows').innerHTML=L.length?L.map(c=>{const last=[...c.msgs].reverse().find(m=>m.x);const pre=(last.d==='out'?'You: ':(c.group&&last.s?last.s+': ':''))+last.x;
    return`<button class="row${c.id===activeId?' active':''}" data-id="${c.id}">${av(c.hue,initials(c.name),42,c.ch)}<div class="mid"><div class="l1"><span class="nm">${c.group?'# ':''}${c.name}</span><span class="tm">${c.time}</span></div><div class="l2"><span class="pv">${pre}</span>${c.unread?`<span class="pill">${c.unread}</span>`:''}</div></div></button>`}).join(''):'<div style="padding:40px 16px;text-align:center;color:var(--faint);font-size:13px">No conversations here.</div>';
}
function renderThread(){
  const c=DATA.find(x=>x.id===activeId);
  $('#thead').innerHTML=`${av(c.hue,initials(c.name),38,c.ch)}<div class="who"><div class="nm">${c.group?'# ':''}${c.name}</div><div class="sub"><span class="pres ${c.pres}"></span>${{online:'Active now',away:'Away',offline:'Offline'}[c.pres]} · ${CH[c.ch].label}</div></div>`;
  let html='',lastDay=null,lastMin=null;
  c.msgs.forEach(m=>{const day=m.day||'Today';const mn=parseMin(m.t);const dc=day!==lastDay;
    if(dc)html+=`<div class="datepill">${day}</div>`;
    if(dc||lastMin===null||mn-lastMin>20)html+=`<div class="timemark">${fmt12(m.t)}</div>`;
    const sender=(m.d==='in'&&m.s)?`<span class="sender" style="color:hsl(${m.sh} 55% 64%)">${m.s}</span>`:'';
    html+=`<div class="msg ${m.d}">${sender}<div class="bubble">${m.x}</div></div>`;
    lastDay=day;lastMin=mn});
  $('#msgs').innerHTML=html;$('#msgs').scrollTop=$('#msgs').scrollHeight;
  $('#ta').placeholder='Message '+c.name.replace(/^#/,'').split(' ')[0]+'…';
}
function renderScheda(){
  const c=DATA.find(x=>x.id===activeId),s=c.sc;
  const idSec=c.group
    ?`<div class="scsec"><h3>Members</h3><div class="members">${s.members.slice(0,5).map(m=>av(m[1],m[0],30,null)).join('')}${s.members.length>5?`<span class="more">+${s.members.length-5} more</span>`:''}</div></div>`
    :`<div class="scsec"><h3>Reachable on <em>· one identity</em></h3><div class="chips">${s.chans.map(k=>`<span class="chip"><span class="dot" style="background:${CH[k].c}">${ICONS[CH[k].i]}</span>${CH[k].label}</span>`).join('')}</div></div>`;
  $('#scheda').innerHTML=`
    <div class="schero">${av(c.hue,initials(c.name),66,c.ch)}<div class="nm">${c.group?'# ':''}${c.name}</div><div class="role"><b>${s.role}</b>${c.group?'':' · '+s.company}</div><div class="scpres"><span class="pres ${c.pres}"></span>${{online:'Active now',away:'Away',offline:'Offline'}[c.pres]}</div></div>
    ${idSec}
    <div class="scsec"><h3>Details</h3><div class="facts">${s.facts.map(f=>`<div class="fact"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('')}</div></div>
    <div class="scsec"><h3>Open topics</h3><div class="topics">${s.topics.map(t=>`<span class="topic">${t}</span>`).join('')}</div></div>
    <div class="scsec"><h3>Shared files</h3><div class="files">${s.files.map(f=>`<div class="file"><span class="fi">${ICONS.file}</span><div style="min-width:0"><div class="fn">${f[0]}</div><div class="fm">${f[1]}</div></div></div>`).join('')}</div></div>
    <div class="brain"><div class="bh">${ICONS.brain} What the brain knows</div><p>${s.brain}</p></div>`;
}
function renderAll(){renderChannels();renderAccents();renderList();renderThread();renderScheda()}

$('#channels').onclick=e=>{const b=e.target.closest('[data-k]');if(b){filter=b.dataset.k;renderChannels();renderList()}};
$('#rows').onclick=e=>{const r=e.target.closest('[data-id]');if(r){activeId=r.dataset.id;const c=DATA.find(x=>x.id===activeId);c.unread=0;$('#app').classList.add('viewing');renderList();renderThread();renderScheda()}};
$('#accents').onclick=e=>{const b=e.target.closest('[data-a]');if(b){accent=ACCENTS.find(a=>a.id===b.dataset.a);setVar();renderAccents()}};
$('#search').oninput=renderList;
$('#back').onclick=()=>$('#app').classList.remove('viewing');
const ta=$('#ta'),send=$('#send');
function sync(){send.disabled=!ta.value.trim();ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'}
ta.oninput=sync;
function doSend(){const v=ta.value.trim();if(!v)return;const c=DATA.find(x=>x.id===activeId);const now=new Date().toTimeString().slice(0,5);c.msgs.push({d:'out',x:v,t:now,day:'Today'});c.time=fmt12(now);ta.value='';sync();renderThread();renderList()}
send.onclick=doSend;
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});

setVar();renderAll();
</script>
